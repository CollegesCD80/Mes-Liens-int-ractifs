            { emoji: '🏆', subject: 'Vie Scolaire', keywords: 'recompense prix' }
        ];

        let categories = [];
        let bookmarks = [];
        let masterKey = "";
        let draggedIndex = null;
        let currentCategory = 'Toutes';
        let currentSubjectFilter = 'Tous';

        const authModal = document.getElementById('authModal');
        const authForm = document.getElementById('authForm');
        const inputMasterKey = document.getElementById('inputMasterKey');
        const mainContent = document.getElementById('mainContent');
        const adminControls = document.getElementById('adminControls');
        const bookmarkGrid = document.getElementById('bookmarkGrid');
        const bookmarkModal = document.getElementById('bookmarkModal');
        const categoryModal = document.getElementById('categoryModal');
        const categoryFilterContainer = document.getElementById('categoryFilterContainer');
        const categoryManageList = document.getElementById('categoryManageList');
        const bookmarkForm = document.getElementById('bookmarkForm');
        const inputId = document.getElementById('bookmarkId');
        const inputTitle = document.getElementById('inputTitle');
        const inputUrl = document.getElementById('inputUrl');
        const inputCategory = document.getElementById('inputCategory');
        const inputIcon = document.getElementById('inputIcon');
        const inputDescription = document.getElementById('inputDescription');
        const iconSearchInput = document.getElementById('iconSearchInput');
        const emojiPickerGrid = document.getElementById('emojiPickerGrid');
        const subjectTabs = document.getElementById('subjectTabs');

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('quest_edu_master_key');
            if (savedKey) inputMasterKey.value = savedKey;
            renderSubjectTabs();
            renderEmojiGrid('');
            setupEventListeners();
        });

        function renderSubjectTabs() {
            subjectTabs.innerHTML = '';
            const subjects = ['Tous', 'Français', 'Mathématiques', 'SVT', 'Physique-Chimie', 'Histoire', 'Géographie', 'EPS', 'Arts', 'Musique', 'Langues', 'Technologie', 'VR & Espace', 'Philosophie / EMC', 'CDI', 'Vie Scolaire'];
            
            subjects.forEach(subj => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `vr-btn px-2.5 py-1 rounded-lg text-[11px] font-semibold transition-all border ${subj === currentSubjectFilter ? 'bg-amber-500 text-slate-950 border-amber-400 font-bold' : 'bg-white/5 text-slate-300 border-white/10 hover:bg-white/10'}`;
                btn.textContent = subj;
                btn.addEventListener('click', () => {
                    currentSubjectFilter = subj;
                    renderSubjectTabs();
                    renderEmojiGrid(iconSearchInput.value);
                });
                subjectTabs.appendChild(btn);
            });
        }

        function renderEmojiGrid(filter = '') {
            emojiPickerGrid.innerHTML = '';
            const query = filter.toLowerCase().trim();

            const filtered = CLASSIFIED_EMOJI_BANK.filter(item => {
                const matchesSubject = currentSubjectFilter === 'Tous' || item.subject === currentSubjectFilter;
                if (!matchesSubject) return false;
                if (!query) return true;
                return item.keywords.includes(query) || item.emoji.includes(query) || item.subject.toLowerCase().includes(query);
            });

            if (filtered.length === 0) {
                emojiPickerGrid.innerHTML = `<div class="col-span-8 sm:col-span-10 text-xs text-slate-400 py-6 italic text-center">Aucune icône correspondante trouvée</div>`;
                return;
            }

            filtered.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'vr-btn p-2 rounded-xl hover:bg-white/20 transition-colors cursor-pointer flex items-center justify-center text-xl';
                btn.textContent = item.emoji;
                btn.title = `[${item.subject}] ${item.keywords.split(' ')[0]}`;
                btn.addEventListener('click', () => {
                    inputIcon.value = item.emoji;
                });
                emojiPickerGrid.appendChild(btn);
            });
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const key = inputMasterKey.value.trim();

            if (!key) {
                showToast('Veuillez entrer votre Master Key !', true);
                return;
            }

            masterKey = key;
            const success = await loadData();
            if (success) {
                localStorage.setItem('quest_edu_master_key', masterKey);
                authModal.classList.add('hidden');
                mainContent.classList.remove('hidden');
                adminControls.classList.remove('hidden');
            }
        });

        document.getElementById('toggleMasterKey').addEventListener('click', () => {
            const type = inputMasterKey.getAttribute('type') === 'password' ? 'text' : 'password';
            inputMasterKey.setAttribute('type', type);
            document.querySelector('#toggleMasterKey i').className = type === 'password' ? 'fa-solid fa-eye text-sm' : 'fa-solid fa-eye-slash text-sm';
        });

        async function loadData() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                    headers: { 'X-Master-Key': masterKey }
                });
                if (response.ok) {
                    const json = await response.json();
                    categories = json.record.categories || ['Toutes'];
                    bookmarks = json.record.bookmarks || [];
                    refreshCategoryViews();
                    renderBookmarks();
                    showToast('Connexion et chargement réussis !');
                    return true;
                } else {
                    showToast('Clé Master Key invalide ou refusée par le serveur !', true);
                    return false;
                }
            } catch (e) { 
                showToast('Erreur de connexion réseau !', true); 
                return false;
            }
        }

        async function saveData() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': masterKey
                    },
                    body: JSON.stringify({ categories, bookmarks })
                });

                if (response.ok) showToast('Modifications enregistrées sur le Cloud !');
                else showToast('Erreur lors de la sauvegarde Cloud', true);
            } catch (e) { showToast('Erreur réseau Cloud', true); }
        }

        function refreshCategoryViews() {
            renderCategories();
            renderCategoriesSelect();
            renderCategoryManageList();
        }

        function renderCategories() {
            categoryFilterContainer.innerHTML = '';
            
            if (!categories.includes('Toutes')) categories.unshift('Toutes');
            const otherCategories = categories.filter(c => c !== 'Toutes').sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
            const sortedCategories = ['Toutes', ...otherCategories];

            if (!sortedCategories.includes(currentCategory)) {
                currentCategory = 'Toutes';
            }

            sortedCategories.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = (cat === currentCategory);
                btn.className = `vr-btn px-5 py-2.5 rounded-2xl text-xs font-bold transition-all border ${isActive ? 'bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 border-amber-300/40 font-black shadow-lg' : 'bg-white/5 text-slate-300 border-white/10'}`;
                btn.innerHTML = `<span>${escapeHTML(cat)}</span>`;
                btn.addEventListener('click', () => {
                    currentCategory = cat;
                    renderCategories();
                    renderBookmarks();
                });
                categoryFilterContainer.appendChild(btn);
            });
        }

        function renderCategoriesSelect() {
            const currentVal = inputCategory.value;
            inputCategory.innerHTML = '';
            const sortedCategories = categories.filter(c => c !== 'Toutes').sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
            
            sortedCategories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat; opt.textContent = cat;
                inputCategory.appendChild(opt);
            });

            if (sortedCategories.includes(currentVal)) {
                inputCategory.value = currentVal;
            }
        }

        function renderCategoryManageList() {
            categoryManageList.innerHTML = '';
            const sortedCategories = categories.filter(c => c !== 'Toutes').sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));

            if (sortedCategories.length === 0) {
                categoryManageList.innerHTML = `<p class="text-xs text-slate-400 italic py-2">Aucune catégorie personnalisée.</p>`;
                return;
            }

            sortedCategories.forEach(cat => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between bg-white/5 border border-white/10 px-3.5 py-2.5 rounded-xl';
                row.innerHTML = `
                    <span class="text-sm text-white font-medium">${escapeHTML(cat)}</span>
                    <button type="button" onclick="deleteCategory('${cat.replace(/'/g, "\\'")}')" class="vr-btn text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 px-2.5 py-1.5 rounded-lg text-xs" title="Supprimer cette catégorie">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                categoryManageList.appendChild(row);
            });
        }

        window.deleteCategory = async function(catName) {
            if (confirm(`Supprimer la catégorie "${catName}" ?`)) {
                categories = categories.filter(c => c !== catName);
                await saveData();
                refreshCategoryViews();
                renderBookmarks();
            }
        };

        function renderBookmarks() {
            bookmarkGrid.innerHTML = '';
            
            const filtered = bookmarks.filter(item => {
                if (currentCategory === 'Toutes') return true;
                return item.category === currentCategory;
            });

            filtered.forEach((item) => {
                const realIndex = bookmarks.findIndex(b => b.id === item.id);
                
                const card = document.createElement('div');
                card.className = 'glass-card rounded-3xl p-4 flex flex-col justify-between relative';
                card.setAttribute('draggable', 'true');
                card.dataset.index = realIndex;

                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('dragenter', handleDragEnter);
                card.addEventListener('dragleave', handleDragLeave);
                card.addEventListener('drop', handleDrop);
                card.addEventListener('dragend', handleDragEnd);

                let iconHTML = `<span class="text-2xl">${item.icon || '🌐'}</span>`;
                if (item.icon && item.icon.startsWith('fa-')) iconHTML = `<i class="fa-brands ${item.icon} text-2xl text-amber-400"></i>`;

                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-2 mb-3">
                            <div class="w-11 h-11 rounded-2xl bg-white/10 border border-white/10 flex items-center justify-center shrink-0">${iconHTML}</div>
                            <span class="text-[10px] font-bold px-2.5 py-1 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-300 line-clamp-2 leading-tight text-right">${escapeHTML(item.category)}</span>
                        </div>
                        <h3 class="text-sm font-bold text-white text-center mb-1.5 line-clamp-2 leading-snug min-h-[2.5rem]" title="${escapeHTML(item.title)}">${escapeHTML(item.title)}</h3>
                        <p class="text-slate-400 text-[11px] text-center leading-relaxed line-clamp-2 mb-3">${escapeHTML(item.description || '')}</p>
                    </div>
                    <div class="flex items-center justify-between gap-1.5 pt-2.5 border-t border-white/5">
                        <div class="flex-1 bg-white/5 text-slate-400 hover:text-amber-400 py-2 rounded-lg text-xs border border-white/10 flex items-center justify-center cursor-grab" title="Glisser pour réorganiser">
                            <i class="fa-solid fa-grip-vertical"></i>
                        </div>
                        <button onclick="editBookmark('${item.id}')" class="vr-btn flex-1 bg-white/5 hover:bg-white/15 text-amber-400 py-2 rounded-lg text-xs border border-white/10 flex items-center justify-center" title="Modifier">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteBookmark('${item.id}')" class="vr-btn flex-1 bg-red-500/10 hover:bg-red-500/20 text-red-400 py-2 rounded-lg text-xs border border-red-500/20 flex items-center justify-center" title="Supprimer">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                bookmarkGrid.appendChild(card);
            });
        }

        // --- GESTIONNAIRES DRAG & DROP ---
        function handleDragStart(e) {
            draggedIndex = parseInt(this.dataset.index);
            e.dataTransfer.effectAllowed = 'move';
            this.classList.add('opacity-40', 'border-amber-400');
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            this.classList.add('border-amber-400', 'scale-[1.01]');
        }

        function handleDragLeave(e) {
            this.classList.remove('border-amber-400', 'scale-[1.01]');
        }

        async function handleDrop(e) {
            e.stopPropagation();
            e.preventDefault();
            this.classList.remove('border-amber-400', 'scale-[1.01]');

            const targetIndex = parseInt(this.dataset.index);
            if (draggedIndex !== null && draggedIndex !== targetIndex) {
                const movedItem = bookmarks.splice(draggedIndex, 1)[0];
                bookmarks.splice(targetIndex, 0, movedItem);

                renderBookmarks();
                await saveData(); 
            }
            return false;
        }

        function handleDragEnd(e) {
            this.classList.remove('opacity-40', 'border-amber-400');
            document.querySelectorAll('#bookmarkGrid > div').forEach(card => {
                card.classList.remove('border-amber-400', 'scale-[1.01]');
            });
        }

        function setupEventListeners() {
            document.getElementById('btnLogout').addEventListener('click', () => {
                localStorage.removeItem('quest_edu_master_key');
                window.location.reload();
            });

            document.getElementById('btnOpenAddModal').addEventListener('click', () => openBookmarkModal());
            document.querySelectorAll('.closeBookmarkModal').forEach(btn => btn.addEventListener('click', () => bookmarkModal.classList.add('hidden')));

            document.getElementById('btnOpenCategoryModal').addEventListener('click', () => {
                renderCategoryManageList();
                categoryModal.classList.remove('hidden');
            });
            document.querySelectorAll('.closeCategoryModal').forEach(btn => btn.addEventListener('click', () => categoryModal.classList.add('hidden')));

            // Recherche dynamique en français dans la banque d'icônes
            iconSearchInput.addEventListener('input', (e) => {
                renderEmojiGrid(e.target.value);
            });

            // Création rapide d'une catégorie depuis la modale de lien
            document.getElementById('btnToggleQuickCat').addEventListener('click', () => {
                document.getElementById('quickCatContainer').classList.toggle('hidden');
            });

            document.getElementById('btnSaveQuickCat').addEventListener('click', async () => {
                const quickInput = document.getElementById('quickCatInput');
                const val = quickInput.value.trim();
                if (val && !categories.includes(val)) {
                    categories.push(val);
                    await saveData();
                    refreshCategoryViews();
                    inputCategory.value = val;
                    quickInput.value = '';
                    document.getElementById('quickCatContainer').classList.add('hidden');
                } else {
                    showToast('Nom invalide ou catégorie déjà existante.', true);
                }
            });

            bookmarkForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = inputId.value || Date.now().toString();
                const newBookmark = { id, title: inputTitle.value.trim(), url: inputUrl.value.trim(), category: inputCategory.value, icon: inputIcon.value.trim() || '🌐', description: inputDescription.value.trim() };
                const idx = bookmarks.findIndex(b => b.id === id);
                if (idx > -1) bookmarks[idx] = newBookmark; else bookmarks.unshift(newBookmark);
                await saveData(); renderBookmarks(); bookmarkModal.classList.add('hidden');
            });

            document.getElementById('btnAddCategory').addEventListener('click', async () => {
                const catInput = document.getElementById('newCategoryInput');
                const val = catInput.value.trim();
                if (val && !categories.includes(val)) {
                    categories.push(val);
                    await saveData();
                    refreshCategoryViews();
                    catInput.value = '';
                } else {
                    showToast('Veuillez entrer un nom valide ou inexistant.', true);
                }
            });
        }

        window.editBookmark = function(id) { const item = bookmarks.find(b => b.id === id); if (item) openBookmarkModal(item); };
        window.deleteBookmark = async function(id) {
            if (confirm('Voulez-vous supprimer ce lien pour toute la classe ?')) {
                bookmarks = bookmarks.filter(b => b.id !== id);
                await saveData();
                renderBookmarks();
            }
        };

        function openBookmarkModal(item = null) {
            document.getElementById('quickCatContainer').classList.add('hidden');
            iconSearchInput.value = '';
            currentSubjectFilter = 'Tous';
            renderSubjectTabs();
            renderEmojiGrid('');
            if (item) {
                document.getElementById('modalTitle').querySelector('span').textContent = 'Modifier la ressource';
                inputId.value = item.id; inputTitle.value = item.title; inputUrl.value = item.url; inputCategory.value = item.category; inputIcon.value = item.icon; inputDescription.value = item.description;
            } else {
                document.getElementById('modalTitle').querySelector('span').textContent = 'Ajouter une ressource';
                bookmarkForm.reset(); inputId.value = '';
            }
            bookmarkModal.classList.remove('hidden');
        }

        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3500);
        }
    </script>
