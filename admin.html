<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration Portail VR - Enseignant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Emoji Picker Element officiel -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        quest: {
                            blue: '#0064e0', purple: '#7b2cbf', cyan: '#00f2fe',
                            dark: '#080c14', panel: 'rgba(18, 24, 38, 0.75)'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #080c14;
            background-image: 
                radial-gradient(at 15% 15%, rgba(123, 44, 191, 0.22) 0px, transparent 55%),
                radial-gradient(at 85% 20%, rgba(0, 100, 224, 0.22) 0px, transparent 55%),
                radial-gradient(at 50% 85%, rgba(0, 242, 254, 0.15) 0px, transparent 55%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #f1f5f9;
        }
        .glass-panel {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(234, 179, 8, 0.5);
        }
        .vr-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .vr-btn:active { transform: scale(0.95); }

        /* Hauteur réduite à 210px pour supprimer le scroll vertical */
        emoji-picker {
            --background: rgba(18, 24, 38, 0.95);
            --border-color: rgba(255, 255, 255, 0.1);
            --input-border-color: rgba(255, 255, 255, 0.2);
            --input-background: rgba(255, 255, 255, 0.05);
            --input-text-color: #f1f5f9;
            --indicator-color: #f59e0b;
            width: 100%;
            height: 210px;
            font-family: 'Inter', sans-serif;
            border-radius: 0.75rem;
        }
    </style>
</head>
<body class="font-sans antialiased text-slate-100 min-h-screen flex flex-col pb-12 select-none">

    <!-- HEADER ADMIN -->
    <header class="sticky top-0 z-40 glass-panel border-b border-white/10 px-4 lg:px-8 py-3.5 mb-6">
        <div class="max-w-[95rem] mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 via-orange-600 to-red-600 flex items-center justify-center shadow-lg text-white text-2xl font-black shrink-0">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-extrabold tracking-wide text-amber-400">
                        Administration des ressources VR
                    </h1>
                    <p class="text-sm text-slate-300 font-medium tracking-wide flex items-center gap-1.5 mt-0.5">
                        <i class="fa-solid fa-school text-amber-400"></i>
                        <span>Collège Jacques Brel - Villers-Bretonneux</span>
                    </p>
                </div>
            </div>

            <div id="adminControls" class="hidden flex flex-wrap items-center gap-3">
                <button id="btnOpenAddModal" class="vr-btn bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-plus"></i>
                    <span>Ajouter un lien</span>
                </button>
                <button id="btnOpenCategoryModal" class="vr-btn bg-white/10 hover:bg-white/20 border border-white/20 text-white px-4 py-2.5 rounded-xl flex items-center gap-2 text-sm font-medium">
                    <i class="fa-solid fa-folder-tree text-amber-400"></i>
                    <span>Gérer les catégories</span>
                </button>
                <a href="index.html" target="_blank" class="vr-btn bg-white/5 hover:bg-white/10 border border-white/15 text-cyan-300 px-4 py-2.5 rounded-xl flex items-center gap-2 text-sm font-medium">
                    <i class="fa-solid fa-eye"></i>
                    <span>Aperçu Élèves</span>
                </a>
                
                <!-- Horloge en temps réel -->
                <div id="liveClock" class="hidden sm:flex items-center justify-center gap-2 bg-white/5 border border-white/10 px-3.5 py-2.5 rounded-xl text-amber-400 text-sm font-semibold tracking-wide font-mono min-w-[125px]">
                    <i class="fa-regular fa-clock"></i>
                    <span id="clockTime">--:--:--</span>
                </div>

                <button id="btnLogout" class="vr-btn bg-red-500/20 hover:bg-red-500/30 text-red-300 border border-red-500/30 px-3.5 py-2.5 rounded-xl font-semibold text-sm" title="Déconnexion">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main id="mainContent" class="max-w-[95rem] mx-auto px-4 lg:px-8 flex-1 w-full hidden">
        <!-- BARRE HORIZONTALE DES CATÉGORIES -->
        <section class="mb-8 overflow-x-auto pb-2">
            <div class="flex items-center gap-2 min-w-max" id="categoryFilterContainer"></div>
        </section>

        <!-- BOOKMARKS GRID -->
        <section>
            <div id="bookmarkGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4"></div>
        </section>
    </main>

    <!-- FORMULAIRE DE CONNEXION -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4">
        <div class="glass-panel w-full max-w-md rounded-3xl p-8 border border-amber-500/40 shadow-2xl relative text-center">
            <div class="w-16 h-16 rounded-2xl bg-amber-500/20 border border-amber-500/40 text-amber-400 text-3xl flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-key"></i>
            </div>
            <h3 class="text-xl font-bold text-white mb-1">Administration VR</h3>
            <p class="text-xs text-slate-300 font-medium tracking-wide flex items-center justify-center gap-1.5 mb-6">
                <i class="fa-solid fa-school text-amber-400"></i>
                <span>Collège Jacques Brel - Villers-Bretonneux</span>
            </p>
            
            <form id="authForm" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-amber-400 uppercase mb-1 text-center">Clé API :</label>
                    <div class="relative">
                        <input type="password" id="inputMasterKey" required placeholder="$2a$10$..." class="w-full pl-4 pr-12 py-3 rounded-xl bg-white/5 border border-white/15 text-white text-sm focus:outline-none focus:border-amber-400">
                        <button type="button" id="toggleMasterKey" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white">
                            <i class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="vr-btn w-full py-3 bg-amber-500 text-slate-950 font-bold rounded-xl text-sm shadow-lg">Connexion</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL AJOUT / ÉDITION DE LIEN -->
    <div id="bookmarkModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden p-4">
        <div class="glass-panel w-full max-w-xl rounded-3xl p-5 border border-white/20 shadow-2xl relative overflow-hidden">
            <div class="flex justify-between items-center mb-3">
                <h3 id="modalTitle" class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-bookmark text-amber-400"></i>
                    <span>Ajouter un lien éducatif</span>
                </h3>
                <button class="closeBookmarkModal vr-btn text-slate-400 hover:text-white p-1 text-base"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="bookmarkForm" class="space-y-2.5">
                <input type="hidden" id="bookmarkId">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-300 uppercase mb-0.5">Titre *</label>
                    <input type="text" id="inputTitle" required class="w-full px-3 py-2 rounded-xl bg-white/5 border border-white/15 text-white text-xs">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-300 uppercase mb-0.5">URL *</label>
                    <input type="url" id="inputUrl" required class="w-full px-3 py-2 rounded-xl bg-white/5 border border-white/15 text-white text-xs">
                </div>
                
                <!-- Catégorie avec création rapide -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-300 uppercase mb-0.5">Catégorie</label>
                    <div class="flex gap-2">
                        <select id="inputCategory" class="flex-1 px-3 py-2 rounded-xl bg-slate-900 border border-white/15 text-white text-xs"></select>
                        <button type="button" id="btnToggleQuickCat" class="vr-btn px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 border border-white/15 text-amber-400 font-bold text-xs" title="Créer une nouvelle catégorie">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                    <div id="quickCatContainer" class="hidden mt-1.5 flex gap-2">
                        <input type="text" id="quickCatInput" placeholder="Nom de la nouvelle catégorie..." class="flex-1 px-3 py-1.5 rounded-xl bg-white/5 border border-amber-500/40 text-white text-xs focus:outline-none">
                        <button type="button" id="btnSaveQuickCat" class="vr-btn px-3 py-1.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs">Ajouter</button>
                    </div>
                </div>

                <!-- Sélecteur d'émojis officiel (210px) -->
                <div>
                    <div class="flex items-center justify-between mb-0.5">
                        <label class="block text-[11px] font-semibold text-slate-300 uppercase">Icône (Emoji)</label>
                        <input type="text" id="inputIcon" placeholder="🚀" class="w-12 text-center bg-white/5 border border-white/15 text-white text-xs rounded-lg py-0.5" readonly>
                    </div>
                    <div class="border border-white/10 rounded-xl overflow-hidden">
                        <emoji-picker id="emojiPickerElement"></emoji-picker>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-300 uppercase mb-0.5">Description</label>
                    <textarea id="inputDescription" rows="1" class="w-full px-3 py-1.5 rounded-xl bg-white/5 border border-white/15 text-white text-xs resize-none"></textarea>
                </div>
                <div class="pt-1.5 flex justify-end gap-2">
                    <button type="button" class="closeBookmarkModal vr-btn px-4 py-2 rounded-xl bg-white/5 text-slate-300 text-xs">Annuler</button>
                    <button type="submit" class="vr-btn px-5 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 font-bold text-xs">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL GESTION DES CATÉGORIES -->
    <div id="categoryModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden p-4">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 border border-white/20 shadow-2xl relative">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-folder-tree text-amber-400"></i>
                    <span>Gérer les catégories</span>
                </h3>
                <button class="closeCategoryModal vr-btn text-slate-400 hover:text-white p-2 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="mb-5">
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Ajouter une nouvelle catégorie</label>
                <div class="flex gap-2">
                    <input type="text" id="newCategoryInput" placeholder="Ex: Géographie..." class="flex-1 px-4 py-2.5 rounded-xl bg-white/5 border border-white/15 text-white text-sm focus:outline-none focus:border-amber-400">
                    <button type="button" id="btnAddCategory" class="vr-btn px-4 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-sm">Ajouter</button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Catégories existantes (Renommer ou Supprimer)</label>
                <div id="categoryManageList" class="max-h-60 overflow-y-auto space-y-2 pr-1"></div>
            </div>

            <div class="pt-5 mt-4 border-t border-white/10 flex justify-end">
                <button type="button" class="closeCategoryModal vr-btn px-5 py-2 rounded-xl bg-white/10 text-white text-sm font-medium">Fermer</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 glass-panel px-5 py-3 rounded-2xl border border-amber-500/40 text-white flex items-center gap-3 shadow-xl pointer-events-none">
        <i id="toastIcon" class="fa-solid fa-circle-check text-amber-400 text-lg"></i>
        <span id="toastMessage" class="text-sm font-medium">Message</span>
    </div>

    <script type="module">
        import fr from 'https://cdn.jsdelivr.net/npm/emoji-picker-element@1/i18n/fr.js';

        const binId = "6adb3157ac6210605a4b8388";
        const emojiPickerElement = document.getElementById('emojiPickerElement');

        // Configuration en français du sélecteur
        emojiPickerElement.i18n = fr;
        emojiPickerElement.locale = 'fr';
        emojiPickerElement.dataSource = 'https://cdn.jsdelivr.net/npm/emoji-picker-element-data@^1/fr/emojibase/data.json';

        let categories = [];
        let bookmarks = [];
        let masterKey = "";
        let draggedIndex = null;
        let currentCategory = 'Toutes';
        let editingCategoryName = null;

        const authModal = document.getElementById('authModal');
        const authForm = document.getElementById('authForm');
        const inputMasterKey = document.getElementById('inputMasterKey');
        const mainContent = document.getElementById('mainContent');
        const adminControls = document.getElementById('adminControls');
        const bookmarkGrid = document.getElementById('bookmarkGrid');
        const bookmarkModal = document.getElementById('bookmarkModal');
        const categoryModal = document.getElementById('categoryModal');
        const categoryFilterContainer = document.getElementById('categoryFilterContainer');
        const categoryManageList = document.getElementById('categoryManageList');
        const bookmarkForm = document.getElementById('bookmarkForm');
        const inputId = document.getElementById('bookmarkId');
        const inputTitle = document.getElementById('inputTitle');
        const inputUrl = document.getElementById('inputUrl');
        const inputCategory = document.getElementById('inputCategory');
        const inputIcon = document.getElementById('inputIcon');
        const inputDescription = document.getElementById('inputDescription');

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('quest_edu_master_key');
            if (savedKey) inputMasterKey.value = savedKey;
            setupEventListeners();
            initClock();
        });

        // Gestion de l'horloge en temps réel
        function initClock() {
            const clockTime = document.getElementById('clockTime');
            function updateClock() {
                const now = new Date();
                clockTime.textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const key = inputMasterKey.value.trim();

            if (!key) {
                showToast('Veuillez entrer votre Master Key !', true);
                return;
            }

            masterKey = key;
            const success = await loadData();
            if (success) {
                localStorage.setItem('quest_edu_master_key', masterKey);
                authModal.classList.add('hidden');
                mainContent.classList.remove('hidden');
                adminControls.classList.remove('hidden');
            }
        });

        document.getElementById('toggleMasterKey').addEventListener('click', () => {
            const type = inputMasterKey.getAttribute('type') === 'password' ? 'text' : 'password';
            inputMasterKey.setAttribute('type', type);
            document.querySelector('#toggleMasterKey i').className = type === 'password' ? 'fa-solid fa-eye text-sm' : 'fa-solid fa-eye-slash text-sm';
        });

        async function loadData() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                    headers: { 'X-Master-Key': masterKey }
                });
                if (response.ok) {
                    const json = await response.json();
                    categories = json.record.categories || ['Toutes'];
                    bookmarks = json.record.bookmarks || [];
                    refreshCategoryViews();
                    renderBookmarks();
                    showToast('Connexion et chargement réussis !');
                    return true;
                } else {
                    showToast('Clé Master Key invalide ou refusée par le serveur !', true);
                    return false;
                }
            } catch (e) { 
                showToast('Erreur de connexion réseau !', true); 
                return false;
            }
        }

        async function saveData() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': masterKey
                    },
                    body: JSON.stringify({ categories, bookmarks })
                });

                if (response.ok) showToast('Modifications enregistrées sur le Cloud !');
                else showToast('Erreur lors de la sauvegarde Cloud', true);
            } catch (e) { showToast('Erreur réseau Cloud', true); }
        }

        function refreshCategoryViews() {
            renderCategories();
            renderCategoriesSelect();
            renderCategoryManageList();
        }

        function renderCategories() {
            categoryFilterContainer.innerHTML = '';
            
            if (!categories.includes('Toutes')) categories.unshift('Toutes');
            const otherCategories = categories.filter(c => c !== 'Toutes').sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
            const sortedCategories = ['Toutes', ...otherCategories];

            if (!sortedCategories.includes(currentCategory)) {
                currentCategory = 'Toutes';
            }

            sortedCategories.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = (cat === currentCategory);
                btn.className = `vr-btn px-5 py-2.5 rounded-2xl text-xs font-bold transition-all border ${isActive ? 'bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 border-amber-300/40 font-black shadow-lg' : 'bg-white/5 text-slate-300 border-white/10'}`;
                btn.innerHTML = `<span>${escapeHTML(cat)}</span>`;
                btn.addEventListener('click', () => {
                    currentCategory = cat;
                    renderCategories();
                    renderBookmarks();
                });
                categoryFilterContainer.appendChild(btn);
            });
        }

        function renderCategoriesSelect() {
            const currentVal = inputCategory.value;
            inputCategory.innerHTML = '';
            const sortedCategories = categories.filter(c => c !== 'Toutes').sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));
            
            sortedCategories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat; opt.textContent = cat;
                inputCategory.appendChild(opt);
            });

            if (sortedCategories.includes(currentVal)) {
                inputCategory.value = currentVal;
            }
        }

        function renderCategoryManageList() {
            categoryManageList.innerHTML = '';
            const sortedCategories = categories.filter(c => c !== 'Toutes').sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }));

            if (sortedCategories.length === 0) {
                categoryManageList.innerHTML = `<p class="text-xs text-slate-400 italic py-2">Aucune catégorie personnalisée.</p>`;
                return;
            }

            sortedCategories.forEach(cat => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between gap-2 bg-white/5 border border-white/10 px-3.5 py-2 rounded-xl';
                
                if (editingCategoryName === cat) {
                    // Mode édition du nom de la catégorie
                    row.innerHTML = `
                        <input type="text" id="renameCatInput" value="${escapeHTML(cat)}" class="flex-1 px-2.5 py-1 rounded-lg bg-black/40 border border-amber-400 text-white text-sm focus:outline-none">
                        <div class="flex items-center gap-1.5 shrink-0">
                            <button type="button" onclick="confirmRenameCategory('${cat.replace(/'/g, "\\'")}')" class="vr-btn text-emerald-400 hover:text-emerald-300 bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/30 px-2.5 py-1.5 rounded-lg text-xs" title="Valider le nouveau nom">
                                <i class="fa-solid fa-check"></i>
                            </button>
                            <button type="button" onclick="cancelRenameCategory()" class="vr-btn text-slate-400 hover:text-white bg-white/5 hover:bg-white/15 border border-white/10 px-2.5 py-1.5 rounded-lg text-xs" title="Annuler">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    `;
                } else {
                    // Affichage normal avec boutons Renommer et Supprimer
                    row.innerHTML = `
                        <span class="text-sm text-white font-medium truncate">${escapeHTML(cat)}</span>
                        <div class="flex items-center gap-1.5 shrink-0">
                            <button type="button" onclick="startRenameCategory('${cat.replace(/'/g, "\\'")}')" class="vr-btn text-amber-400 hover:text-amber-300 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/20 px-2.5 py-1.5 rounded-lg text-xs" title="Renommer cette catégorie">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button type="button" onclick="deleteCategory('${cat.replace(/'/g, "\\'")}')" class="vr-btn text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 px-2.5 py-1.5 rounded-lg text-xs" title="Supprimer cette catégorie">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    `;
                }
                categoryManageList.appendChild(row);
            });

            // Focus automatique sur le champ de saisie en cas d'édition
            if (editingCategoryName) {
                const input = document.getElementById('renameCatInput');
                if (input) {
                    input.focus();
                    input.select();
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            window.confirmRenameCategory(editingCategoryName);
                        } else if (e.key === 'Escape') {
                            window.cancelRenameCategory();
                        }
                    });
                }
            }
        }

        window.startRenameCategory = function(catName) {
            editingCategoryName = catName;
            renderCategoryManageList();
        };

        window.cancelRenameCategory = function() {
            editingCategoryName = null;
            renderCategoryManageList();
        };

        window.confirmRenameCategory = async function(oldName) {
            const input = document.getElementById('renameCatInput');
            if (!input) return;
            const newName = input.value.trim();

            if (!newName) {
                showToast('Le nom de la catégorie ne peut pas être vide.', true);
                return;
            }
            if (newName === oldName) {
                editingCategoryName = null;
                renderCategoryManageList();
                return;
            }
            if (categories.some(c => c.toLowerCase() === newName.toLowerCase())) {
                showToast('Une catégorie porte déjà ce nom.', true);
                return;
            }

            // 1. Renommer dans la liste des catégories
            categories = categories.map(c => (c === oldName ? newName : c));

            // 2. Mettre à jour toutes les ressources associées à l'ancienne catégorie
            bookmarks = bookmarks.map(b => (b.category === oldName ? { ...b, category: newName } : b));

            // 3. Mettre à jour le filtre actif si nécessaire
            if (currentCategory === oldName) {
                currentCategory = newName;
            }

            editingCategoryName = null;
            await saveData();
            refreshCategoryViews();
            renderBookmarks();
        };

        window.deleteCategory = async function(catName) {
            if (confirm(`Supprimer la catégorie "${catName}" ?`)) {
                categories = categories.filter(c => c !== catName);
                await saveData();
                refreshCategoryViews();
                renderBookmarks();
            }
        };

        function renderBookmarks() {
            bookmarkGrid.innerHTML = '';
            
            const filtered = bookmarks.filter(item => {
                if (currentCategory === 'Toutes') return true;
                return item.category === currentCategory;
            });

            filtered.forEach((item) => {
                const realIndex = bookmarks.findIndex(b => b.id === item.id);
                
                const card = document.createElement('div');
                card.className = 'glass-card rounded-3xl p-4 flex flex-col justify-between relative';
                card.setAttribute('draggable', 'true');
                card.dataset.index = realIndex;

                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('dragenter', handleDragEnter);
                card.addEventListener('dragleave', handleDragLeave);
                card.addEventListener('drop', handleDrop);
                card.addEventListener('dragend', handleDragEnd);

                let iconHTML = `<span class="text-2xl">${item.icon || '🌐'}</span>`;
                if (item.icon && item.icon.startsWith('fa-')) iconHTML = `<i class="fa-brands ${item.icon} text-2xl text-amber-400"></i>`;

                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-2 mb-3">
                            <div class="w-11 h-11 rounded-2xl bg-white/10 border border-white/10 flex items-center justify-center shrink-0">${iconHTML}</div>
                            <span class="text-[10px] font-bold px-2.5 py-1 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-300 line-clamp-2 leading-tight text-right">${escapeHTML(item.category)}</span>
                        </div>
                        <h3 class="text-sm font-bold text-white text-center mb-1.5 line-clamp-2 leading-snug min-h-[2.5rem]" title="${escapeHTML(item.title)}">${escapeHTML(item.title)}</h3>
                        <p class="text-slate-400 text-[11px] text-center leading-relaxed line-clamp-2 mb-3">${escapeHTML(item.description || '')}</p>
                    </div>
                    <div class="flex items-center justify-between gap-1.5 pt-2.5 border-t border-white/5">
                        <div class="flex-1 bg-white/5 text-slate-400 hover:text-amber-400 py-2 rounded-lg text-xs border border-white/10 flex items-center justify-center cursor-grab" title="Glisser pour réorganiser">
                            <i class="fa-solid fa-grip-vertical"></i>
                        </div>
                        <a href="${escapeHTML(item.url)}" target="_blank" rel="noopener noreferrer" class="vr-btn flex-1 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 py-2 rounded-lg text-xs border border-cyan-500/20 flex items-center justify-center" title="Ouvrir la ressource">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                        <button onclick="editBookmark('${item.id}')" class="vr-btn flex-1 bg-white/5 hover:bg-white/15 text-amber-400 py-2 rounded-lg text-xs border border-white/10 flex items-center justify-center" title="Modifier">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteBookmark('${item.id}')" class="vr-btn flex-1 bg-red-500/10 hover:bg-red-500/20 text-red-400 py-2 rounded-lg text-xs border border-red-500/20 flex items-center justify-center" title="Supprimer">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                bookmarkGrid.appendChild(card);
            });
        }

        // --- GESTIONNAIRES DRAG & DROP ---
        function handleDragStart(e) {
            draggedIndex = parseInt(this.dataset.index);
            e.dataTransfer.effectAllowed = 'move';
            this.classList.add('opacity-40', 'border-amber-400');
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            this.classList.add('border-amber-400', 'scale-[1.01]');
        }

        function handleDragLeave(e) {
            this.classList.remove('border-amber-400', 'scale-[1.01]');
        }

        async function handleDrop(e) {
            e.stopPropagation();
            e.preventDefault();
            this.classList.remove('border-amber-400', 'scale-[1.01]');

            const targetIndex = parseInt(this.dataset.index);
            if (draggedIndex !== null && draggedIndex !== targetIndex) {
                const movedItem = bookmarks.splice(draggedIndex, 1)[0];
                bookmarks.splice(targetIndex, 0, movedItem);

                renderBookmarks();
                await saveData(); 
            }
            return false;
        }

        function handleDragEnd(e) {
            this.classList.remove('opacity-40', 'border-amber-400');
            document.querySelectorAll('#bookmarkGrid > div').forEach(card => {
                card.classList.remove('border-amber-400', 'scale-[1.01]');
            });
        }

        function setupEventListeners() {
            document.getElementById('btnLogout').addEventListener('click', () => {
                localStorage.removeItem('quest_edu_master_key');
                window.location.reload();
            });

            document.getElementById('btnOpenAddModal').addEventListener('click', () => openBookmarkModal());
            document.querySelectorAll('.closeBookmarkModal').forEach(btn => btn.addEventListener('click', () => bookmarkModal.classList.add('hidden')));

            document.getElementById('btnOpenCategoryModal').addEventListener('click', () => {
                editingCategoryName = null;
                renderCategoryManageList();
                categoryModal.classList.remove('hidden');
            });
            document.querySelectorAll('.closeCategoryModal').forEach(btn => btn.addEventListener('click', () => {
                editingCategoryName = null;
                categoryModal.classList.add('hidden');
            }));

            emojiPickerElement.addEventListener('emoji-click', event => {
                inputIcon.value = event.detail.unicode;
            });

            document.getElementById('btnToggleQuickCat').addEventListener('click', () => {
                document.getElementById('quickCatContainer').classList.toggle('hidden');
            });

            document.getElementById('btnSaveQuickCat').addEventListener('click', async () => {
                const quickInput = document.getElementById('quickCatInput');
                const val = quickInput.value.trim();
                if (val && !categories.includes(val)) {
                    categories.push(val);
                    await saveData();
                    refreshCategoryViews();
                    inputCategory.value = val;
                    quickInput.value = '';
                    document.getElementById('quickCatContainer').classList.add('hidden');
                } else {
                    showToast('Nom invalide ou catégorie déjà existante.', true);
                }
            });

            bookmarkForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = inputId.value || Date.now().toString();
                const newBookmark = { id, title: inputTitle.value.trim(), url: inputUrl.value.trim(), category: inputCategory.value, icon: inputIcon.value.trim() || '🌐', description: inputDescription.value.trim() };
                const idx = bookmarks.findIndex(b => b.id === id);
                if (idx > -1) bookmarks[idx] = newBookmark; else bookmarks.unshift(newBookmark);
                await saveData(); renderBookmarks(); bookmarkModal.classList.add('hidden');
            });

            document.getElementById('btnAddCategory').addEventListener('click', async () => {
                const catInput = document.getElementById('newCategoryInput');
                const val = catInput.value.trim();
                if (val && !categories.includes(val)) {
                    categories.push(val);
                    await saveData();
                    refreshCategoryViews();
                    catInput.value = '';
                } else {
                    showToast('Veuillez entrer un nom valide ou inexistant.', true);
                }
            });
        }

        window.editBookmark = function(id) { const item = bookmarks.find(b => b.id === id); if (item) openBookmarkModal(item); };
        window.deleteBookmark = async function(id) {
            if (confirm('Voulez-vous supprimer ce lien pour toute la classe ?')) {
                bookmarks = bookmarks.filter(b => b.id !== id);
                await saveData();
                renderBookmarks();
            }
        };

        function openBookmarkModal(item = null) {
            document.getElementById('quickCatContainer').classList.add('hidden');
            if (item) {
                document.getElementById('modalTitle').querySelector('span').textContent = 'Modifier la ressource';
                inputId.value = item.id; inputTitle.value = item.title; inputUrl.value = item.url; inputCategory.value = item.category; inputIcon.value = item.icon; inputDescription.value = item.description;
            } else {
                document.getElementById('modalTitle').querySelector('span').textContent = 'Ajouter une ressource';
                bookmarkForm.reset(); inputId.value = '';
                inputIcon.value = '🚀';
            }
            bookmarkModal.classList.remove('hidden');
        }

        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3500);
        }
    </script>
</body>
</html>
